name: Build & Release Android APK

# Declansat la orice tag de forma v1.2.3
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# GITHUB_TOKEN trebuie sa poata crea release-uri
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. JDK 17 ──────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle cache ────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 4. Decodeaza keystore-ul (stocat ca secret Base64) ─────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > apaoltenia.jks

      # ── 5. Extrage versiunea din tag (v1.2.3 → 1.2.3) ─────────────
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "TAG=$TAG"     >> $GITHUB_OUTPUT
          echo "VERSION=$VER" >> $GITHUB_OUTPUT

      # ── 5b. Tag-ul trebuie sa coincida cu versionName din Gradle ───
      # Altfel s-ar publica un APK care se raporteaza pe sine cu alta
      # versiune decat release-ul: verificarea din aplicatie ar propune
      # actualizarea la nesfarsit (sau n-ar vedea-o deloc).
      - name: Verify tag matches versionName
        run: |
          GRADLE_VER=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts)
          if [ "$GRADLE_VER" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.VERSION }} != versionName $GRADLE_VER din app/build.gradle.kts"
            exit 1
          fi

      # ── 6. Build APK release semnat ────────────────────────────────
      # Cheia si parolele vin din secrets, prin variabile de mediu citite
      # in app/build.gradle.kts (KEYSTORE_FILE / KEYSTORE_PASSWORD / ...).
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/apaoltenia.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # ── 7. Redenumeste APK cu versiunea ────────────────────────────
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "ApaOltenia-v${{ steps.version.outputs.VERSION }}.apk"

      # ── 7b. Notele de release, generate din Changelog.kt ───────────
      # Changelog-ul din aplicatie e sursa unica de adevar pentru noutati;
      # extragem cea mai noua intrare si o punem in corpul release-ului.
      # Daca versiunea din changelog nu coincide cu tag-ul, oprim publicarea
      # (inseamna ca s-a uitat actualizarea changelog-ului).
      - name: Generate release notes from changelog
        run: |
          python3 - "${{ steps.version.outputs.VERSION }}" <<'EOF'
          import re, sys
          tag_version = sys.argv[1]
          src = open('app/src/main/java/ro/apaoltenia/client/Changelog.kt', encoding='utf-8').read()
          m = re.search(r'Entry\(\s*"([^"]+)",\s*"([^"]+)",\s*listOf\((.*?)\)\s*\)', src, re.S)
          if not m:
              sys.exit('::error::Nu am gasit nicio intrare in Changelog.kt')
          version, date, body = m.group(1), m.group(2), m.group(3)
          if version != tag_version:
              sys.exit(f'::error::Tag {tag_version} != versiunea {version} din Changelog.kt — actualizeaza changelog-ul')
          items = [i.replace('\\"', '"') for i in re.findall(r'"((?:[^"\\]|\\.)*)"', body)]
          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(f'## ApaOltenia Client v{version} ({date})\n\n')
              f.write('### Noutati\n')
              for it in items:
                  f.write(f'- {it}\n')
              f.write('\n### Actualizare din aplicatie (recomandat)\n')
              f.write('Daca ai deja o versiune instalata, aplicatia verifica automat la\n')
              f.write('pornire si iti propune sa **descarce si sa instaleze** noua versiune\n')
              f.write('direct din aplicatie — nu mai e nevoie sa vii aici manual.\n')
              f.write('\n### Instalare manuala (prima instalare)\n')
              f.write('1. Descarca fisierul `.apk` de mai jos\n')
              f.write('2. Pe telefon: **Setari → Securitate → Instalare aplicatii necunoscute**\n')
              f.write('3. Deschide fisierul si instaleaza\n')
          EOF

      # ── 8. Creeaza GitHub Release cu APK-ul ────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "ApaOltenia Client v${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          files: "ApaOltenia-v${{ steps.version.outputs.VERSION }}.apk"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
