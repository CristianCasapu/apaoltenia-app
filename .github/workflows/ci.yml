name: CI

# Verificari automate la fiecare pull request si la push pe main:
# build de debug (fara semnare, deci fara secrete) + Android Lint.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Push-urile succesive pe acelasi branch anuleaza rularea veche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (debug) + Lint + Teste unitare
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon

      # Rapoartele lint si teste, descarcabile cand verificarea pica.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
